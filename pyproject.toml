[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartml-assistant"
version = "2.0.2"
description = "A production-grade Multi-Paradigm AutoML & Data Science engine (Supervised, Unsupervised, Semi-supervised, Reinforcement, Self-supervised)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SmartML Contributors", email = "contributors@smartml.org" }]
keywords = ["automl", "machine-learning", "reinforcement-learning", "semi-supervised", "self-supervised", "forecasting", "data-science", "sklearn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/sughan-pv770/smartml-assistant"
Repository = "https://github.com/sughan-pv770/smartml-assistant"
Documentation = "https://github.com/sughan-pv770/smartml-assistant#readme"
"Bug Tracker" = "https://github.com/sughan-pv770/smartml-assistant/issues"

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
tuning   = ["optuna>=3.0"]
explain  = ["shap>=0.43"]
viz      = ["plotly>=5.0", "seaborn>=0.12"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
]
all = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.0",
    "shap>=0.43",
    "plotly>=5.0",
    "seaborn>=0.12",
]

[tool.setuptools.packages.find]
include = ["smartml*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
testpaths = ["tests"]
