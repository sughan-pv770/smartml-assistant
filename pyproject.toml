[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartml-assistant"
version = "2.1.0"
description = "A production-grade Multi-Paradigm AutoML & Data Science engine with the Mial Voice Assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SmartML Contributors", email = "contributors@smartml.org" }]
keywords = ["automl", "machine-learning", "reinforcement-learning", "semi-supervised", "self-supervised", "forecasting", "data-science", "sklearn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/sughan-pv770/smartml-assistant"
Repository = "https://github.com/sughan-pv770/smartml-assistant"
Documentation = "https://github.com/sughan-pv770/smartml-assistant#readme"
"Bug Tracker" = "https://github.com/sughan-pv770/smartml-assistant/issues"

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
tuning   = ["optuna>=3.0"]
explain  = ["shap>=0.43"]
viz      = ["plotly>=5.0", "seaborn>=0.12"]
io       = ["pyarrow>=14.0", "openpyxl>=3.1", "sqlalchemy>=2.0"]
voice = [
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
    "pynput>=1.7.6",
]
mial = [
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
    "pynput>=1.7.6",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
]
all = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.0",
    "shap>=0.43",
    "plotly>=5.0",
    "seaborn>=0.12",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
    "pynput>=1.7.6",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
smartml-voice = "smartml.agent.voice_agent:main_cli"
mial = "smartml.mial.cli:main"

[tool.setuptools.packages.find]
include = ["smartml*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
testpaths = ["tests"]
